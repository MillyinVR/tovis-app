name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits need no further runner time. Main/manual/scheduled
# runs keep unique groups so every final verification still completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Node's default heap cap lands near 2GB on a hosted runner — below what
    # tsc needs here. This job-level value covers Lint and the test run; the
    # Typecheck step raises it further on its own (see that step).
    #
    # Deliberately NOT raised job-wide: `pnpm test` runs vitest with a worker
    # per core, and a ceiling is per PROCESS. Four workers each entitled to 6GB
    # can exhaust a 16GB runner, which kills the runner outright instead of
    # failing with a readable heap error. Only the step that actually needs the
    # headroom gets it.
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # This action installs pnpm by running `npm install`, and npm audits during
        # an install. That puts npm's advisory service on the critical path of this
        # job before any of our code runs. On 2026-09-04 that service stopped
        # answering and this step went from ~11s to 425s on main, which pushed the
        # unit-test job past its 15-minute cap. Measured with the service degraded:
        # `npm install` 51s, `NPM_CONFIG_AUDIT=false npm install` 0.26s.
        #
        # We do not want npm's opinion on the two packages its own installer pulls;
        # our dependencies are audited by the security-scan workflow.
        env:
          NPM_CONFIG_AUDIT: 'false'
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` owns its 6GB TypeScript heap so this check behaves the
      # same locally and in CI. Keep the step-level value as a belt-and-braces
      # guard for Prisma generation and any future Node subprocesses.
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # CLAUDE.md has always mandated lint before pushing, but no workflow ran
      # it — so an introduced ESLint *error* shipped green. Warnings stay
      # non-blocking (there is a large pre-existing backlog); this fails only on
      # errors, which is what the house rule actually asks for.
      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test
