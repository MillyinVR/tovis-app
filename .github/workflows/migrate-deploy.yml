name: migrate-deploy

# Applies pending Prisma migrations to the production database on every merge to
# main, so the schema can never drift behind the deployed code.
#
# ⚠️ The paragraph that used to be here said the Vercel build "never runs
# `prisma migrate deploy`". That is FALSE and has been for as long as
# `vercel.json` has carried:
#
#     "buildCommand": "if [ \"$VERCEL_ENV\" = \"production\" ]; then prisma migrate deploy; fi && next build"
#
# A production `vercel --prod` DOES apply pending migrations, before the build,
# and fails the whole deploy if they fail (the `if` block's status feeds the
# `&&`). That is what actually applied 20260919010000 on 2026-08-25.
#
# Why this workflow still exists: deploys are MANUAL here
# (`git.deploymentEnabled: false`), so code can sit merged and undeployed for
# days. Applying expand-phase migrations at MERGE time keeps the schema from
# lagging the moment someone does deploy, and is the belt to Vercel's braces —
# `migrate deploy` is idempotent and advisory-locked, so both running is safe.
# Without either, a migration merged alongside the code that needs it silently
# misses production until the deployed code hits the missing column/enum and
# 500s (the 2026-06-13 `proTenantId` MediaAsset outage).
#
# 🔴 Read the JOB LOG, not the check's colour. When the secrets below are unset
# this job SKIPS the migrate step and still reports SUCCESS — deliberately, see
# the preflight step — so a green "Deploy DB migrations (production)" is NOT
# evidence that anything was applied. Verify with the STEP list, which names the
# skip that the check's colour hides:
#
#   gh api repos/MillyinVR/tovis-app/actions/runs/<id>/jobs \
#     --jq '.jobs[].steps[] | "\(.conclusion)\t\(.name)"'
#
# 2026-08-28: both secrets are now SET, so the step runs for real. Every run
# before that date skipped — do not read an old green run as evidence that its
# migration reached prod.
#
# Scope: runs ONLY on push to main (and manual dispatch) — never on
# pull_request — so it cannot touch preview/branch databases. It applies
# whatever is pending; with the team's expand→contract discipline, expand
# (additive) migrations are backward-compatible, and contract migrations are
# only merged once their expand phase is fully deployed, so auto-applying on
# merge is safe in both cases.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PRODUCTION_DATABASE_URL  – pooled connection string (the app's DATABASE_URL)
#   PRODUCTION_DIRECT_URL    – direct connection string (DIRECT_URL); this is
#                              what `migrate deploy` actually connects through.
# Until both are set, the job SKIPS `migrate deploy` and surfaces a loud
# `::warning::` annotation plus a job-summary note on every main push — the
# signal that migrations are NOT being auto-applied yet, without a permanently
# red check that erodes trust in CI. Add both secrets to enable auto-migration.
# (Set 2026-08-28 from the prod Supabase project's pooled + session URLs.)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs and NEVER cancel an in-flight migration — queue instead.
concurrency:
  group: migrate-deploy-production
  cancel-in-progress: false

jobs:
  migrate-deploy:
    name: Deploy DB migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts skips the postinstall `prisma generate`; migrate deploy
      # needs only the prisma CLI + migration files + schema, not the client.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Detect whether the production DB secrets are configured. When they are
      # absent we SKIP the migrate step (and warn) instead of failing the job,
      # so an unconfigured repo does not leave a permanently red check on main.
      - name: Check for production DB secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PRODUCTION_DATABASE_URL and/or PRODUCTION_DIRECT_URL is not set — skipping prisma migrate deploy. Production migrations are NOT being auto-applied. Add both in Settings → Secrets and variables → Actions to enable."
            {
              echo "### ⚠️ Production migrations NOT applied"
              echo ""
              echo "\`PRODUCTION_DATABASE_URL\` and/or \`PRODUCTION_DIRECT_URL\` secrets are not configured, so this run skipped \`prisma migrate deploy\`."
              echo ""
              echo "Add both in **Settings → Secrets and variables → Actions** to enable automatic production migrations on merge to main."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ALLOW_PROD_DB is REQUIRED here, not optional. `prisma.config.ts` refuses
      # any db-touching Prisma CLI command whose URL carries the prod project ref
      # — the guard added after the 2026-06-17 stray `prisma db push` against
      # prod — and it exempts only `process.env.VERCEL`. A GitHub runner is not
      # Vercel, so without this the step dies on the guard before it connects.
      #
      # That is exactly what happened the first time this step ever executed
      # (run 33131000416, 2026-08-28): the secrets had just been added, the
      # preflight passed, and the migrate step failed on the guard. Until then
      # the step had always SKIPPED for want of secrets, so the missing opt-in
      # had never been reachable — the workflow had never once worked.
      #
      # Setting it is deliberate: targeting production IS this job's whole
      # purpose, it runs only on push to main / manual dispatch (never on a PR,
      # so a fork can never reach it), and `migrate deploy` applies committed
      # migrations only — it can never generate or infer one the way `db push`
      # can. The guard still protects every OTHER caller, which is the point.
      - name: Apply pending migrations
        if: steps.preflight.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          ALLOW_PROD_DB: '1'
        run: pnpm exec prisma migrate deploy
