name: live-model-contract

# Sends the consult's REAL structured-output schemas — and REAL oversized
# images — to the REAL Messages API, and checks they compile, answer, and parse.
#
# Why this workflow exists: `runConsultAnalysis` shipped for two schema
# versions unable to make one successful request — the API refused its
# json_schema, first for unsupported keywords and then for the size of the
# compiled grammar. Every consult test mocks the provider, so unit-tests.yml
# and integration.yml were green throughout and the only symptom was
# CONSULT_ANALYSIS_UNAVAILABLE in production. No mock can catch that; only a
# live request can.
#
# Nightly rather than per-PR, because it costs real money, needs a real key,
# and depends on a third party being up — none of which belong on a merge gate.
# A PR that changes a consult schema should be run through it by hand
# (workflow_dispatch) before merging.

on:
  schedule:
    # 07:20 UTC daily. Off the hour on purpose: the top of the hour is the
    # busiest cron slot on GitHub's shared runners and jobs get queued there.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The notify job below opens/comments on an issue when a run fails.
  issues: write

concurrency:
  # One live run at a time. A queued second run would bill a second set of
  # vision calls to prove the same thing.
  group: live-model-contract
  cancel-in-progress: false

jobs:
  consult-schema:
    name: Consult schemas and images against the live model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # npm audits during the install this action performs, which put npm's
        # advisory service on the critical path of every job (see the same note
        # in unit-tests.yml, and the 425s outage on 2026-09-04).
        env:
          NPM_CONFIG_AUDIT: 'false'
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite THROWS rather than skips when the key is absent, so a missing
      # or expired secret goes red here instead of passing silently — which is
      # the failure mode that let the broken schema ship in the first place.
      - name: Consult provider schema contract
        run: pnpm test:live:consult-schema
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 2026-09-07 (v4). The colour policy changed — warm light and colour cast
      # stopped refusing a photo, and hard rejection narrowed to a frame that
      # cannot be READ. That whole change rests on one sentence of prompt
      # ("judge dark and bright by LEGIBILITY, not preference"), every capture
      # test mocks the provider, and until now NOTHING had ever sent a real
      # image to `checkConsultCapture`. The dark-frame case is the load-bearing
      # one: if it ever starts passing an image through, v4 has become
      # permissive and the gate is doing nothing.
      #
      # Runs even if the step above fails — a schema refusal and a gate verdict
      # are different findings and the nightly should report both.
      - name: Consult capture-gate verdicts
        if: ${{ !cancelled() }}
        run: pnpm test:live:consult-capture-gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # P2e. Same reasoning one layer down: the schemas compiling says nothing
      # about the IMAGES. A production run failed six times on a reference 32 KB
      # over the consult's own ceiling, and every test mocked the provider, so
      # nothing could tell "an oversized image is handled" from "an oversized
      # image has never been tried". This sends one through each entry path.
      #
      # Runs even if the step above fails: a schema refusal and an image
      # refusal are different findings and the nightly should report both.
      - name: Consult image normalization contract
        if: ${{ !cancelled() }}
        run: pnpm test:live:consult-normalization
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Failure notification ────────────────────────────────────────────────
  #
  # 🔴 Why this exists. This workflow went dead for at least three nights
  # (2026-09-05, 09-06, 09-07) with no API key, failing every scheduled run —
  # straight through the v4 colour-gate change — and nobody noticed. GitHub does
  # email the workflow file's last committer when a SCHEDULED run fails, but
  # that clearly is not landing anywhere anyone reads: the whole point of this
  # suite is to catch what mocks cannot, and a suite nobody knows is red catches
  # nothing at all.
  #
  # An ISSUE rather than Slack or SMTP, deliberately: it needs no new secret
  # (the default GITHUB_TOKEN is enough), it survives a webhook rotting the way
  # the Sentry→Slack integration silently did, and assigning it emails Tori
  # through the notification path she already uses. If a direct Slack ping is
  # wanted instead, that needs a SLACK_WEBHOOK_URL secret — see the PR.
  #
  # 🔴 THIS REPOSITORY IS PUBLIC. The issue body carries the run LINK, the job
  # name and the commit only — never log text, never error bodies. A provider
  # error here can quote request content, and this repo has leaked a secret into
  # public view once already.
  notify-on-failure:
    name: Report a failed live-model run
    runs-on: ubuntu-latest
    needs: consult-schema
    if: ${{ failure() }}
    permissions:
      issues: write

    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'live-model-contract'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            // Link only — never log text. This repository is public.
            const body = [
              `The nightly live-model contract failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha.slice(0, 8)}\``,
              ``,
              `This suite sends the consult's real schemas and real images to the`,
              `live Messages API. It is the only check that can catch a provider`,
              `contract break, and it is not a merge gate — so a red run here is`,
              `invisible unless someone looks. Open the run for the verdicts.`,
            ].join('\n')

            // Make sure the label exists before filtering on it.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'B60205',
                description: 'A nightly live-model contract run failed',
              })
            }

            // One issue, many failures: a new issue per night would bury the
            // first one, which is what a three-night outage looks like.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            })

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              })
              core.notice(`Commented on existing issue #${open[0].number}`)
              return
            }

            const { data: created } = await github.rest.issues.create({
              ...context.repo,
              title: 'Nightly live-model contract is failing',
              labels: [label],
              assignees: ['MillyinVR'],
              body,
            })
            core.notice(`Opened issue #${created.number}`)

