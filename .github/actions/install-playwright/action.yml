name: Install Playwright browsers
description: Install Playwright browsers without depending on the runner's unused Chrome APT feed.
runs:
  using: composite
  steps:
    - name: Remove unused runner Chrome package source
      shell: bash
      run: |
        # Playwright downloads its own browsers; it needs Ubuntu libraries,
        # not Google's google-chrome-stable package. A stale Google APT index
        # can fail the entire dependency install with a hash mismatch.
        # This is also the cleanup performed by actions/runner-images in
        # images/ubuntu/scripts/build/install-google-chrome.sh.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
    - name: Install browsers and system dependencies
      shell: bash
      run: pnpm exec playwright install --with-deps
